name: Whence daily Maps leads

on:
  schedule:
    - cron: "43 0 * * *" # 06:13 IST every day
  workflow_dispatch:
    inputs:
      queries:
        description: "Optional: one-off searches separated by ; (e.g. skincare brand in Pune; cafe in Goa). Leave empty to use the sheet's Maps Config tab."
        required: false
        default: ""
      rotation:
        description: "Extra searches from lead-queries.txt to add (0 to turn off)"
        required: false
        default: "4"

permissions:
  contents: read

concurrency:
  group: whence-leads
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      LEADS_SHEET_ID: ${{ secrets.LEADS_SHEET_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet gspread

      - name: Read today's searches from the lead sheet
        id: plan
        env:
          CUSTOM_QUERIES: ${{ github.event.inputs.queries }}
          ROTATION_BATCH: ${{ github.event.inputs.rotation || '4' }}
        run: python whence/sheet_sync.py queries run/queries.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run Google Maps Scraper
        run: |
          docker run --rm \
            -v "$PWD/run:/work" \
            gosom/google-maps-scraper \
            -input /work/queries.txt \
            -results /work/results.csv \
            -depth ${{ steps.plan.outputs.depth || 1 }} \
            -email \
            -exit-on-inactivity 5m

      - name: Add new leads to the Maps Leads tab
        run: python whence/sheet_sync.py push run/results.csv | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep this run's files for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_id }}
          path: run/
          retention-days: 14
